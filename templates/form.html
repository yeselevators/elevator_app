<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lift Quote Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-purple-50 min-h-screen flex items-center justify-center p-6">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-2xl border border-purple-200">
    <h2 class="text-3xl font-bold mb-6 text-center text-purple-800">📝 Lift Quote Form</h2>

    <form id="client-form" class="space-y-8">

      <!-- Client Info -->
      <div>
        <h3 class="text-xl font-semibold mb-2 text-purple-700 flex items-center gap-2"><i data-feather="user"></i>Client Information</h3>
        <label class="block mb-1">Client Name</label>
        <input required name="client_name" class="w-full border rounded-xl px-4 py-2 mb-3"/>

        <label class="block mb-1">Client Address</label>
        <input required name="client_address" class="w-full border rounded-xl px-4 py-2 mb-3"/>

        <label class="block mb-1">Client City</label>
        <input required name="client_city" class="w-full border rounded-xl px-4 py-2 mb-3"/>

        <label class="block mb-1">Site Name</label>
        <input required name="site_name" class="w-full border rounded-xl px-4 py-2 mb-3"/>

        <label class="block mb-1">Type</label>
        <select required name="type" class="w-full border rounded-xl px-4 py-2">
          <option value="">Select Type</option>
          <option>Passenger</option>
          <option>Car</option>
          <option>Hospital</option>
          <option>Goods</option>
        </select>
      </div>

      <!-- Technical Specs -->
      <div>
        <h3 class="text-xl font-semibold mb-2 text-purple-700 flex items-center gap-2"><i data-feather="cpu"></i>Technical Specs</h3>

        <label class="block mb-1">Capacity (person)</label>
        <input required type="number" name="capacity" id="capacity" class="w-full border rounded-xl px-4 py-2 mb-3"/>

        <label class="block mb-1">Speed (m/s)</label>
        <input required type="text" name="speed" class="w-full border rounded-xl px-4 py-2 mb-3"/>

        <label class="block mb-1">Weight (auto)</label>
        <input readonly type="number" name="weight" id="weight" class="w-full border bg-gray-100 rounded-xl px-4 py-2 mb-3"/>

        <label class="block mb-1">Floors</label>
        <input required name="floors" class="w-full border rounded-xl px-4 py-2 mb-3"/>

        <label class="block mb-1">Stops</label>
        <input required type="number" name="stops" class="w-full border rounded-xl px-4 py-2 mb-3"/>

        <label class="block mb-1">Openings</label>
        <input required type="number" name="opening" id="opening" class="w-full border rounded-xl px-4 py-2 mb-3"/>

        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="block mb-1">Shaft Width (mm)</label>
            <input required type="number" name="width" class="w-full border rounded-xl px-4 py-2"/>
          </div>
          <div>
            <label class="block mb-1">Shaft Depth (mm)</label>
            <input required type="number" name="depth" class="w-full border rounded-xl px-4 py-2"/>
          </div>
          <div>
            <label class="block mb-1">Shaft Height (auto)</label>
            <input required readonly type="number" name="height" id="shaft_height" class="w-full border bg-gray-100 rounded-xl px-4 py-2"/>
          </div>
        </div>
      </div>

      <!-- Car Details -->
      <div>
        <h3 class="text-xl font-semibold mb-2 text-purple-700 flex items-center gap-2"><i data-feather="truck"></i>Car Details</h3>

        <label class="block mb-1">Car Opening (mm)</label>
        <input required type="number" name="car_opening" class="w-full border rounded-xl px-4 py-2 mb-3"/>

        <label class="block mb-1">Door Type</label>
        <select required name="door_type" class="w-full border rounded-xl px-4 py-2 mb-3">
          <option value="">Select Door Type</option>
          <option>M.S center</option>
          <option>M.S telescopic</option>
          <option>S.S center</option>
          <option>S.S telescopic</option>
        </select>

        <label class="block mb-1">Cabin Type</label>
        <select required name="cabin_type" class="w-full border rounded-xl px-4 py-2 mb-3">
          <option value="">Select Cabin Type</option>
          <option>M.S powder coated</option>
          <option>S.S hairline finish</option>
          <option>S.S decorative</option>
        </select>

        <label class="block mb-1">Car Width (mm)</label>
        <input required type="number" name="car_width" class="w-full border rounded-xl px-4 py-2 mb-3"/>

        <label class="block mb-1">Car Depth (mm)</label>
        <input required type="number" name="car_depth" class="w-full border rounded-xl px-4 py-2 mb-3"/>
      </div>

      <!-- Quote -->
      <div>
        <h3 class="text-xl font-semibold mb-2 text-purple-700 flex items-center gap-2"><i data-feather="file-text"></i>Quote</h3>

        <label class="block mb-1">Rate (₹)</label>
        <input required type="number" name="rate" id="rate" class="w-full border rounded-xl px-4 py-2 mb-3"/>

        <label class="block mb-1">Quantity</label>
        <input required type="number" name="quantity" id="quantity" class="w-full border rounded-xl px-4 py-2 mb-3"/>

        <label class="block mb-1">Total Amount (₹)</label>
        <input readonly type="text" name="amount" id="amount" class="w-full bg-gray-100 border rounded-xl px-4 py-2 mb-3"/>

        <label class="block mb-1">Amount in Words</label>
        <input readonly type="text" name="amount_words" id="amount_words" class="w-full bg-gray-100 border rounded-xl px-4 py-2 mb-3"/>

        <label class="block mb-1">Installation Period (weeks)</label>
        <input required type="number" name="installation_period" class="w-full border rounded-xl px-4 py-2"/>
      </div>

      <!-- Submit -->
      <div class="text-center pt-4">
        <button type="submit" class="bg-purple-600 text-white px-6 py-2 rounded-xl hover:bg-purple-700 transition">Get QUOTE</button>
      </div>
    </form>
  </div>

  <script>
    feather.replace();

    const capacityInput = document.getElementById('capacity');
    const weightInput = document.getElementById('weight');
    const openingInput = document.getElementById('opening');
    const heightInput = document.getElementById('shaft_height');
    const rateInput = document.getElementById('rate');
    const qtyInput = document.getElementById('quantity');
    const totalInput = document.getElementById('amount');
    const wordsInput = document.getElementById('amount_words');

    capacityInput.addEventListener('input', () => {
      const capacity = parseFloat(capacityInput.value) || 0;
      weightInput.value = capacity * 68;
    });

    openingInput.addEventListener('input', () => {
      const openings = parseFloat(openingInput.value) || 0;
      heightInput.value = (openings * 3.3).toFixed(2);
    });

    function formatIndianNumber(num) {
      return new Intl.NumberFormat('en-IN').format(num);
    }

    function numberToWords(num) {
      const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
        'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
      const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

      const convert = (n) => {
        if (n < 20) return a[n];
        if (n < 100) return b[Math.floor(n / 10)] + (n % 10 ? ' ' + a[n % 10] : '');
        if (n < 1000) return a[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' and ' + convert(n % 100) : '');
        if (n < 100000) return convert(Math.floor(n / 1000)) + ' Thousand' + (n % 1000 ? ' ' + convert(n % 1000) : '');
        if (n < 10000000) return convert(Math.floor(n / 100000)) + ' Lakh' + (n % 100000 ? ' ' + convert(n % 100000) : '');
        return convert(Math.floor(n / 10000000)) + ' Crore' + (n % 10000000 ? ' ' + convert(n % 10000000) : '');
      };

      return convert(num).toUpperCase() + ' RUPEES ONLY';
    }

    function calculateAmount() {
      const rate = parseFloat(rateInput.value) || 0;
      const qty = parseFloat(qtyInput.value) || 0;
      const total = rate * qty;
      totalInput.value = formatIndianNumber(total);
      wordsInput.value = numberToWords(total);
    }

    rateInput.addEventListener('input', calculateAmount);
    qtyInput.addEventListener('input', calculateAmount);

    document.getElementById('client-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const data = new FormData(this);
      const formObject = Object.fromEntries(data.entries());

      fetch('/generate-doc', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formObject)
      })
      .then(res => res.blob())
      .then(blob => {
        const clientName = formObject.client_name?.replace(/\s+/g, "_") || "Client";
        const siteName = formObject.site_name?.replace(/\s+/g, "_") || "Site";
        const filename = `${clientName}_${siteName}.docx`;

        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
      });
    });
  </script>
</body>
</html>
